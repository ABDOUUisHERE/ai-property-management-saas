[project]
name = "property-management-api"
version = "0.1.0"
description = "Modular Property Management API and workers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.17,<2",
  "prometheus-client>=0.23,<1",
  "celery[redis]>=5.6,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.17,<1", "mypy>=1.18,<2", "openapi-spec-validator>=0.7,<1", "types-redis>=4.6"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a dedicated PostgreSQL database and Redis"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src/app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
