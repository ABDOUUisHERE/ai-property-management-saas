name: Local foundations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.25
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_repository.py
      - run: uv run pytest
      - run: uv run python scripts/scan_secrets.py
      - run: uv run python scripts/dev.py init
      - run: docker compose config --quiet

  infrastructure:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.25
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/dev.py init
      - run: uv run python scripts/dev.py up
      - run: uv run python scripts/dev.py smoke
      - name: Service status
        if: always()
        run: docker compose ps --all
      - name: Stop ephemeral runner services
        if: always()
        run: docker compose down
